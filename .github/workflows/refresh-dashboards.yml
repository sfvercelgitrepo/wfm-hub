name: Refresh dashboards from Jira

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-refresh.txt

      - name: Export Jira + rebuild dashboards
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SSL_VERIFY: ${{ secrets.JIRA_SSL_VERIFY }}
        run: python3 scripts/refresh_all.py

      - name: Commit and push updated HTML
        run: |
          git config user.name "wfm-hub-refresh"
          git config user.email "wfm-hub-refresh@users.noreply.github.com"
          git add WFMEstimates.html WFMRequirementsCapabilityMap.html WFMSprintProgress.html
          if git diff --staged --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Refresh dashboards from Jira (automated)."
            # Rebase onto latest main so UI commits pushed during the run do not fail the push.
            git pull --rebase origin main
            git push origin HEAD
          fi
